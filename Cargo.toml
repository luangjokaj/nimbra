[package]
name = "nimbra"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = "0.4.45"
futures = "0.3"
getrandom = "0.2"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
html2text = "0.17.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# IMAP for accounts that are not Gmail. Without its own TLS: `tls.rs` gives it rustls.
imap = { version = "=3.0.0-alpha.15", default-features = false }
# Its protocol types (folder attributes, appended UIDs), which it does not re-export.
imap-proto = "0.16"
mail-parser = { version = "0.11", features = ["full_encoding"] }
raw-window-handle = "0.6"
# The same TLS stack ureq uses, for IMAP and SMTP.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
unicode-segmentation = "1.13.3"
ureq = { version = "2", features = ["json"] }
url = "2.5.9"
webpki-roots = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

# The same versions wry uses, for what it does not pass on (see `webview.rs`).
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = "0.58"
