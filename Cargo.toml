[package]
name = "nimbra"
version = "0.1.7"
edition = "2024"

[dependencies]
# The mail engine, shared with the iOS app (github.com/nimbra-mail/core), pinned to a
# release tag. To build against a local checkout in ../core instead, run
# `scripts/local-core.sh on` (a gitignored Cargo patch; see the README).
nimbra-core = { git = "https://github.com/nimbra-mail/core", tag = "v0.1.6" }
anyhow = "1.0.105"
base64 = "0.22"
chrono = "0.4.45"
futures = "0.3"
getrandom = "0.2"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
raw-window-handle = "0.6"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
unicode-segmentation = "1.13.3"
ureq = { version = "2", features = ["json"] }
url = "2.5.9"

[dev-dependencies]
# The same engine with its test helpers (temporary stores), for the app's own tests.
nimbra-core = { git = "https://github.com/nimbra-mail/core", tag = "v0.1.6", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

# The same versions wry uses, for what it does not pass on (see `webview.rs`).
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = "0.58"
