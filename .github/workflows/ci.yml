name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      # The mail engine (nimbra-core) comes from git at the tag in Cargo.toml.
      - uses: actions/checkout@v4
        with:
          path: desktop
      # A Cargo.lock made with scripts/local-core.sh on points nimbra-core at ../core;
      # it must name a GitHub release, or a merged core commit pinned by rev.
      - name: Check the mail engine's source
        run: |
          source=$(awk '/^name = "nimbra-core"$/ { found = 1; next }
                        found && /^source = / { print; exit }
                        found && /^$/ { exit }' Cargo.lock)
          case "$source" in
            # A release tag, or a merged commit pinned by rev between core releases.
            'source = "git+https://github.com/nimbra-mail/core?tag='*|'source = "git+https://github.com/nimbra-mail/core?rev='*) echo "$source" ;;
            *)
              echo "::error file=Cargo.lock::nimbra-core is not from github.com/nimbra-mail/core (${source:-a local path}). Run scripts/local-core.sh off and commit Cargo.lock again."
              exit 1
              ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
